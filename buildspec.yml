version: 0.2

env:
  variables:
    IMAGE_TAG: "latest"
    APP_NAME: "pedidos"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "=== Installing dependencies ==="
      - pip install --upgrade pip
      - pip install "fastapi>=0.111.0" "uvicorn[standard]>=0.29.0" "pydantic>=2.7.0"
      - pip install "pytest>=8.2.0" "httpx>=0.27.0"

  pre_build:
    commands:
      - echo "=== Running unit tests ==="
      - pytest test_orders.py -v --tb=short
      - echo "=== Tests passed ==="

  build:
    commands:
      - echo "=== Build started on $(date) ==="
      - zip -r ${APP_NAME}-${CODEBUILD_BUILD_NUMBER:-0}.zip main.py pyproject.toml Dockerfile
      - echo "=== Artifact created ==="

  post_build:
    commands:
      - echo "=== Build completed on $(date) ==="

artifacts:
  files:
    - "*.zip"
    - main.py
    - pyproject.toml
    - Dockerfile
  name: "${APP_NAME}-build-$(date +%Y%m%d%H%M%S)"
  discard-paths: no

reports:
  pytest_reports:
    files:
      - "test-results/*.xml"
    file-format: JUNITXML

cache:
  paths:
    - "/root/.cache/pip/**/*"
